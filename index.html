<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agrinhoo</title>

  <style>
    body {
      background: #1e1e1e;
      color: rgb(250, 249, 249);
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 100px;
    }

    button {
      padding: 10px 20px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background-color: #4CAF50; /* Cor verde para combinar com o Agrinho */
      color: white;
      margin-top: 20px;
    }

    button:hover {
      background-color: #45a049; /* Muda de cor ao passar o mouse */
    }
  </style>
</head>
<body>

  <h1>Meu primeiro site</h1>

  <p>Projeto Agrinhoo</p>

  <button onclick="mensagem()">
    Clique aqui
  </button>

  <script>
    function mensagem(){
      alert("Site funcionando!");
    }
  </script>

</body>
</html>
